<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2c3e50" />
            <stop offset="100%" stop-color="#3498db" />
        </linearGradient>
    </defs>
    <rect width="800" height="200" fill="url(#bg)" rx="15" />
    <text x="400" y="100" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">
        Awesome Space Utilization Analytics
    </text>
    <circle cx="100" cy="100" r="20" fill="white" opacity="0.5">
        <animate attributeName="r" values="20;30;20" dur="2s" repeatCount="indefinite"/>
    </circle>
</svg>